<nav class="nav" aria-label="Navegación principal">
  <a class="brand" routerLink="/horario">
    <span class="brand-mark" aria-hidden="true">H</span>
    <span class="brand-name">Horarios y Aulas</span>
  </a>
  <ul>
    @for (item of items(); track item.path) {
      <li>
        <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">
          {{ item.label }}
          @if (item.badge && notices.unread() > 0) {
            <span class="badge-count" [attr.aria-label]="notices.unread() + ' sin leer'">{{ notices.unread() }}</span>
          }
        </a>
      </li>
    }
  </ul>
  <div class="right">
    <button type="button" class="tutorial" (click)="tutorial.open()" aria-haspopup="dialog">
      <span class="tutorial-mark" aria-hidden="true">?</span>
      Tutorial
    </button>
    @if (auth.user(); as user) {
      <div class="account">
        <span class="avatar" aria-hidden="true">{{ initials() }}</span>
        <span class="who">
          <span class="name">{{ user.nombre }}</span>
          <span class="role" [class]="'role ' + user.rol">{{ roleLabels[user.rol] }}</span>
        </span>
        <button type="button" class="icon-button" (click)="password.open()" title="Cambiar contraseña" aria-label="Cambiar contraseña">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7a4 4 0 1 1-3.87 5H9v2H7v2H4v-3l6.13-6.13A4 4 0 0 1 15 7zM16 8h.01" /></svg>
        </button>
        <button type="button" class="logout" (click)="logout()">Salir</button>
      </div>
    }
  </div>
</nav>
<app-password-dialog #password />
