<dialog #dialog class="dialog" aria-labelledby="password-title">
  <h2 id="password-title">Cambiar contraseña</h2>
  <form class="form-stack" [formGroup]="form" (ngSubmit)="save()" novalidate>
    <label class="field">
      <span class="field-label">Contraseña actual</span>
      <input formControlName="actual" type="password" autocomplete="current-password" [attr.aria-invalid]="!!errorMessage(form.controls.actual, 'La contraseña actual')" />
      @if (errorMessage(form.controls.actual, 'La contraseña actual'); as msg) {
        <span class="field-error">{{ msg }}</span>
      }
    </label>
    <label class="field">
      <span class="field-label">Nueva contraseña (mínimo 8 caracteres)</span>
      <input formControlName="nueva" type="password" autocomplete="new-password" [attr.aria-invalid]="!!errorMessage(form.controls.nueva, 'La nueva contraseña')" />
      @if (errorMessage(form.controls.nueva, 'La nueva contraseña'); as msg) {
        <span class="field-error">{{ msg }}</span>
      }
    </label>
    @if (error(); as msg) {
      <p class="form-error" role="alert">{{ msg }}</p>
    }
    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="close()">Cancelar</button>
      <button type="submit" class="btn-primary" [disabled]="saving()">{{ saving() ? 'Guardando…' : 'Guardar' }}</button>
    </div>
  </form>
</dialog>
