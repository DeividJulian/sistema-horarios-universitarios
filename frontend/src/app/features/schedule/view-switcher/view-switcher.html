<div class="switcher">
  <div class="segmented" role="tablist" aria-label="Vista del horario">
    @for (v of views(); track v) {
      <button
        type="button"
        role="tab"
        class="segment"
        [class.active]="view() === v"
        [attr.aria-selected]="view() === v"
        (click)="view.set(v)"
      >
        {{ labels[v] }}
      </button>
    }
  </div>

  @if (view() !== 'semana') {
    <div class="days" role="group" aria-label="Día">
      @for (d of days(); track d.day) {
        <button
          type="button"
          class="day"
          [class.active]="day() === d.day"
          [attr.aria-pressed]="day() === d.day"
          (click)="day.set(d.day)"
        >
          <span class="day-name">{{ d.date === todayIso ? 'Hoy' : d.day }}</span>
          <span class="day-date">{{ shortDate(d.date) }}</span>
        </button>
      }
    </div>
  }
</div>
